<style>
  :root {
    --bg: #3a2c66;
    --ink: #fffaf3;
    --ink-dim: rgba(255, 250, 243, 0.8);
    --flame: #ffd36b;
    --pink: #ff6b9a;
    --glass: rgba(58, 36, 84, 0.5);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: var(--bg); color: var(--ink);
    font-family: "Fraunces", Georgia, serif;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: none; overscroll-behavior: none;
  }
  canvas#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  .overlay {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center;
    padding: 24px 16px; transition: opacity 1.2s ease;
  }
  .hidden { opacity: 0; pointer-events: none; }

  #start { background: linear-gradient(180deg, #2b2a6b 0%, #7a4a9a 38%, #e0779c 72%, #ffbf86 100%); z-index: 10; }
  #start h1 { font-weight: 300; font-size: clamp(56px, 16vw, 120px); margin: 0; letter-spacing: -0.02em; line-height: 1; }
  #start h1 em { font-family: Caveat, cursive; font-style: normal; font-weight: 700; color: var(--flame); font-size: 1.15em; }
  #start p { color: var(--ink-dim); max-width: 30ch; font-size: 17px; line-height: 1.5; margin: 18px 0 32px; }
  #start button {
    font: inherit; font-size: 18px; color: #fff; background: var(--pink);
    border: 0; border-radius: 999px; padding: 16px 30px; cursor: pointer;
    box-shadow: 0 6px 30px rgba(255, 107, 154, 0.55);
  }
  #start small { color: var(--ink-dim); margin-top: 18px; font-size: 13px; }

  #hud {
    position: fixed; left: 0; right: 0; bottom: max(28px, env(safe-area-inset-bottom));
    display: flex; flex-direction: column; align-items: center; gap: 12px;
    pointer-events: none; z-index: 5; padding: 0 16px; text-align: center;
  }
  #hint {
    background: var(--glass); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    border: 1px solid rgba(255, 220, 170, 0.18); border-radius: 999px;
    padding: 12px 22px; font-size: 16px; transition: opacity .5s ease, transform .3s ease;
  }
  #hint.shake { animation: shake .45s ease; }
  @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-8px)} 75%{transform:translateX(8px)} }
  #meter { width: 160px; height: 4px; border-radius: 4px; background: rgba(255,255,255,.12); overflow: hidden; transition: opacity .4s; }
  #meter i { display: block; height: 100%; width: 0%; background: linear-gradient(90deg, var(--flame), var(--pink)); border-radius: 4px; }
  #counter { position: fixed; top: max(16px, env(safe-area-inset-top)); right: 16px; font-size: 14px; color: var(--ink-dim); z-index: 5; letter-spacing: .04em; }
  .arrow { display: inline-block; animation: bob 1.6s ease-in-out infinite; }
  @keyframes bob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(4px)} }

  #final { z-index: 6; pointer-events: none; }
  #final .card {
    max-width: 520px; background: rgba(58, 36, 84, 0.6); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 220, 170, 0.2); border-radius: 24px; padding: 32px 26px; pointer-events: auto;
  }
  #final h2 { font-weight: 300; font-size: clamp(36px, 10vw, 56px); margin: 0 0 16px; line-height: 1.05; }
  #final h2 em { font-family: Caveat, cursive; font-style: normal; font-weight: 700; color: var(--flame); font-size: 1.2em; }
  #final p { font-size: 17px; line-height: 1.6; color: var(--ink); margin: 0 0 14px; white-space: pre-line; }
  #final .sig { font-style: italic; color: var(--flame); margin-top: 20px; font-size: 22px; }
  #final button { font: inherit; margin-top: 18px; background: none; border: 1px solid rgba(255,220,170,.35); color: var(--ink-dim); border-radius: 999px; padding: 10px 18px; cursor: pointer; }

  #final { overflow-y: auto; touch-action: pan-y; justify-content: safe center; }
  #final:not(.hidden) { pointer-events: auto; }
  .gift { margin-top: 22px; }
  .gift-hint { font-family: Caveat, cursive; font-size: 26px !important; color: var(--flame) !important; margin: 0 0 10px !important; }
  .scratch { position: relative; width: min(340px, 76vw); aspect-ratio: 1124 / 1004; margin: 0 auto; border-radius: 16px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,.25); }
  .scratch img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .scratch canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: grab; transition: opacity .8s ease; }
  .gift-caption { font-family: Caveat, cursive; font-size: 30px !important; margin: 12px 0 0 !important; opacity: 0; transition: opacity .8s ease; }
  .gift-caption.show { opacity: 1; }
  #debug { position: fixed; top: 10px; left: 10px; z-index: 20; font: 12px ui-monospace, monospace; background: rgba(0,0,0,.7); padding: 8px 10px; border-radius: 8px; display: none; line-height: 1.5; }
  #debug .bar { height: 6px; background: #333; width: 180px; position: relative; }
  #debug .bar i { position: absolute; left: 0; top: 0; bottom: 0; background: #6cf; }
  #debug .bar b { position: absolute; top: -2px; bottom: -2px; width: 2px; background: #f55; }
</style>

<body>
<canvas id="scene"></canvas>

<div id="start" class="overlay">
  <h1>Alisa <em>17</em></h1>
  <p id="start-text"></p>

<div id="counter"></div>

        <img src="photos/gift.jpg" alt="" draggable="false">
        <canvas id="scratch-canvas"></canvas>
      </div>
      <p class="gift-caption" id="gift-caption"></p>
    </div>
    <button id="again"></button>
  </div>
</div>

<div id="debug">
  <div>rms <span id="d-rms">0</span> · floor <span id="d-floor">0</span> · low <span id="d-low">0</span></div>

<script type="module">
import * as THREE from 'three';

// ───────────────────────── content ─────────────────────────
const TEXT = {
  startText: 'Seitsemäntoista vuotta, seitsemäntoista kynttilää. Kulje eteenpäin vierittämällä ja puhalla jokainen kynttilä sammuksiin.',
  startButton: 'Aloita 🕯️',
  startSmall: 'Mikrofoni kuuntelee puhallustasi. Mitään ei tallenneta.',
  scroll: 'Vieritä <span class="arrow">↓</span>',
  blow: 'Puhalla kynttilä sammuksiin 💨',
  blowNoMic: 'Paina ja pidä pohjassa 💨',
  blocked: 'Puhalla ensin kynttilä sammuksiin 🕯️',
  wish: 'Toivo jotain ✨',
  finalTitle: 'Hyvää synttäriä, <em>Alisa</em>!',
  finalBody: 'Menestystä, mahtavia kokemuksia ja suuria seikkailuja sulle yksin ja meille yhdessä! ❤️',
  finalSig: 'Папа',
  again: 'Kulje uudestaan',
  giftHint: 'Lahjasi odottaa – raaputa esiin! 🎁',
  giftFoil: 'Raaputa ✨',
  giftCaption: 'Tadaa! 💗',
  counter: (n) => `${n} / 17 🕯️`,
};

// Station 0 is the newborn photo (no candle); stations 1–17 each have a candle.
const PHOTOS = [
  { file: 'alisa-00-2009.jpg', label: '11.10.2009' },
  { file: 'alisa-01-2010.jpg', label: '2010' },
  { file: 'alisa-02-2011.jpg', label: '2011' },
  { file: 'alisa-03-2012.jpg', label: '2012' },
  { file: 'alisa-04-2013.jpg', label: '2013' },
  { file: 'alisa-05-2014.jpg', label: '2014' },
  { file: 'alisa-06-2015.jpg', label: '2015' },
  { file: 'alisa-07-2016.jpg', label: '2016' },
  { file: 'alisa-08-2017.jpg', label: '2017' },
  { file: 'alisa-09-2018.jpg', label: '2018' },
  { file: 'alisa-10-2019.jpg', label: '2019' },
  { file: 'alisa-11-2020.jpg', label: '2020' },
  { file: 'alisa-12-2021.jpg', label: '2021' },
  { file: 'alisa-13-2022.jpg', label: '2022' },
  { file: 'alisa-14-2024-feb.jpg', label: '2024' },
  { file: 'alisa-15-2024-jul.jpg', label: '2024' },
  { file: 'alisa-16-2025.jpg', label: '2025' },
  { file: 'alisa-17-2026.jpg', label: '2026' },
];

const DEBUG = new URLSearchParams(location.search).has('debug');
const FREE = new URLSearchParams(location.search).has('free'); // preview: no blocking, photos already lit
const SPACING = 6.5;
const N = PHOTOS.length;          // 18 photo stations
const FINALE = N;                 // station index 18 = finale

// ───────────────────────── DOM ─────────────────────────
const $ = (id) => document.getElementById(id);
$('start-text').textContent = TEXT.startText;
$('go').textContent = TEXT.startButton;
$('start-small').textContent = TEXT.startSmall;
$('final-title').innerHTML = TEXT.finalTitle;
$('final-body').textContent = TEXT.finalBody;
$('final-sig').textContent = TEXT.finalSig;
$('again').textContent = TEXT.again;
$('gift-hint').textContent = TEXT.giftHint;
$('gift-caption').textContent = TEXT.giftCaption;
if (DEBUG) $('debug').style.display = 'block';

const hintEl = $('hint'), meterEl = $('meter'), meterFill = meterEl.querySelector('i');
let hintKey = '';
function setHint(key, html) {
  if (key === hintKey) return;
  hintKey = key;
  if (!html) { hintEl.style.opacity = 0; return; }
  hintEl.innerHTML = html;
  hintEl.style.opacity = 1;
}
function shakeHint() {
  hintEl.classList.remove('shake'); void hintEl.offsetWidth; hintEl.classList.add('shake');
}

// ───────────────────────── renderer / scene ─────────────────────────
const canvas = $('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9b6a8f);
scene.fog = new THREE.Fog(0xa86f8e, 12, 52);

const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.05, 400);

scene.add(new THREE.HemisphereLight(0xffd9ea, 0x4b3a5e, 1.15));
const sunLight = new THREE.DirectionalLight(0xffc49a, 1.1); sunLight.position.set(3, 6, 8); scene.add(sunLight);
const candleLight = new THREE.PointLight(0xffa64d, 0, 6, 1.6);
scene.add(candleLight);

// sunset sky dome (follows the camera)
const sky = new THREE.Mesh(
  new THREE.SphereGeometry(300, 32, 16),
  new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false, fog: false,
    vertexShader: `varying vec3 vP; void main(){ vP = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
    fragmentShader: `varying vec3 vP;
      void main(){
        float h = normalize(vP).y;
        vec3 horizon = vec3(1.0, 0.74, 0.52), pink = vec3(0.93, 0.47, 0.62), violet = vec3(0.45, 0.30, 0.62), top = vec3(0.17, 0.16, 0.42);
        vec3 c = mix(horizon, pink, smoothstep(-0.02, 0.16, h));
        c = mix(c, violet, smoothstep(0.14, 0.42, h));
        c = mix(c, top, smoothstep(0.42, 0.95, h));
        gl_FragColor = vec4(c, 1.0);
        #include <colorspace_fragment>
      }`,
  })
);
scene.add(sky);

// ground + path
const pathLen = SPACING * (N + 4);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(400, 400), new THREE.MeshStandardMaterial({ color: 0x5b4a6e, roughness: 1 }));
ground.rotation.x = -Math.PI / 2; ground.position.y = -0.01; scene.add(ground);
const path = new THREE.Mesh(new THREE.PlaneGeometry(3.2, pathLen), new THREE.MeshStandardMaterial({ color: 0xd9b48f, roughness: 0.9 }));
path.rotation.x = -Math.PI / 2; path.position.z = -pathLen / 2 + 8; scene.add(path);

// ───────────────────────── textures ─────────────────────────
function radialTexture(inner, outer) {
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const x = c.getContext('2d'), gr = x.createRadialGradient(64, 64, 0, 64, 64, 64);
  gr.addColorStop(0, inner); gr.addColorStop(1, outer);
  x.fillStyle = gr; x.fillRect(0, 0, 128, 128);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
const glowTex = radialTexture('rgba(255,190,110,1)', 'rgba(255,140,40,0)');
const bulbTex = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const x = c.getContext('2d'), gr = x.createRadialGradient(32, 32, 0, 32, 32, 32);
  gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(0.18, 'rgba(255,255,255,0.95)'); gr.addColorStop(0.45, 'rgba(255,255,255,0.25)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
  x.fillStyle = gr; x.fillRect(0, 0, 64, 64);
  return new THREE.CanvasTexture(c);
})();
const smokeTex = radialTexture('rgba(240,235,245,0.55)', 'rgba(240,235,245,0)');

const PARTY = ['#ff6b9a', '#ffc94d', '#6bd0ff', '#9b7bff', '#5fe0a8', '#ff8a5c'];

// string lights: one strand along each side and one across the path at every station
{
  const pos = [], col = [];
  const poleMat = new THREE.MeshStandardMaterial({ color: 0x6b4f3e, roughness: 0.8 });
  const wireMat = new THREE.LineBasicMaterial({ color: 0x2c2238, transparent: true, opacity: 0.6 });
  const strand = (a, b, sag) => {
    const pts = [];
    const n = Math.max(6, Math.round(a.distanceTo(b) / 0.42));
    for (let k = 0; k <= n; k++) {
      const f = k / n, p = a.clone().lerp(b, f); p.y -= Math.sin(f * Math.PI) * sag; pts.push(p);
      if (k > 0 && k < n) {
        pos.push(p.x, p.y - 0.05, p.z);
        const c = new THREE.Color(PARTY[(pos.length / 3) % PARTY.length]); c.lerp(new THREE.Color(0xffffff), 0.25);
        col.push(c.r, c.g, c.b);
      }
    }
    scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), wireMat));
  };
  const H = 3.2, X = 2.7;
  for (let i = -1; i <= N + 1; i++) {
    const z = -i * SPACING;
    for (const sx of [-1, 1]) {
      const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.045, H, 8), poleMat);
      pole.position.set(sx * X, H / 2, z); scene.add(pole);
      if (i <= N) strand(new THREE.Vector3(sx * X, H, z), new THREE.Vector3(sx * X, H, z - SPACING), 0.45);
    }
    strand(new THREE.Vector3(-X, H, z), new THREE.Vector3(X, H, z - SPACING / 2), 0.7);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  scene.add(new THREE.Points(g, new THREE.PointsMaterial({ size: 0.26, map: bulbTex, vertexColors: true, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, fog: false })));
}

// balloons
const balloons = [];
{
  const geo = new THREE.SphereGeometry(0.22, 20, 16);
  const knotGeo = new THREE.ConeGeometry(0.03, 0.05, 8);
  const strMat = new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.55 });
  for (let k = 0; k < 44; k++) {
    const color = new THREE.Color(PARTY[k % PARTY.length]);
    const mat = new THREE.MeshStandardMaterial({ color, roughness: 0.25, metalness: 0.05, emissive: color, emissiveIntensity: 0.18 });
    const g = new THREE.Group();
    const b = new THREE.Mesh(geo, mat); b.scale.set(1, 1.18, 1);
    const knot = new THREE.Mesh(knotGeo, mat); knot.position.y = -0.27; knot.rotation.x = Math.PI;
    const len = 0.9 + Math.random() * 0.8;
    const str = new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0, -0.29, 0), new THREE.Vector3(0.05, -0.29 - len / 2, 0), new THREE.Vector3(0, -0.29 - len, 0)]), strMat);
    g.add(b, knot, str);
    const side = k % 2 ? 1 : -1;
    const by = 1.7 + Math.random() * 1.4;
    g.position.set(side * (1.9 + Math.random() * 1.6), by, 3 - Math.random() * SPACING * (N + 1.5));
    scene.add(g);
    balloons.push({ g, by, seed: Math.random() * 10 });
  }
}

// drifting confetti specks
const embers = (() => {
  const n = 220, g = new THREE.BufferGeometry(), pos = new Float32Array(n * 3), col = new Float32Array(n * 3), seed = new Float32Array(n);
  for (let i = 0; i < n; i++) {
    pos[i * 3] = (Math.random() - 0.5) * 9;
    pos[i * 3 + 1] = Math.random() * 4;
    pos[i * 3 + 2] = 4 - Math.random() * SPACING * (N + 2);
    const c = new THREE.Color(PARTY[i % PARTY.length]); col.set([c.r, c.g, c.b], i * 3);
    seed[i] = Math.random() * 100;
  }
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.BufferAttribute(col, 3));
  scene.add(new THREE.Points(g, new THREE.PointsMaterial({ size: 0.05, vertexColors: true, transparent: true, opacity: 0.9, depthWrite: false })));
  return { g, pos, seed, n };
})();

function placeholderTexture(label) {
  const c = document.createElement('canvas'); c.width = 768; c.height = 1024;
  const x = c.getContext('2d');
  const gr = x.createLinearGradient(0, 0, 768, 1024);
  gr.addColorStop(0, '#f6c3d3'); gr.addColorStop(1, '#c9b6f2');
  x.fillStyle = gr; x.fillRect(0, 0, 768, 1024);
  x.fillStyle = 'rgba(255,255,255,.9)'; x.textAlign = 'center';
  x.font = '700 160px Caveat, cursive'; x.fillText(label, 384, 560);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}

function labelTexture(text, sub) {
  const c = document.createElement('canvas'); c.width = 1024; c.height = 220;
  const x = c.getContext('2d'); x.textAlign = 'center'; x.textBaseline = 'middle';
  x.fillStyle = '#3b3050';
  if (sub) {
    x.font = '700 120px Caveat, cursive'; x.fillText(text, 512, 82);
    x.fillStyle = '#7a6a8c'; x.font = '500 64px Caveat, cursive'; x.fillText(sub, 512, 170);
  } else {
    x.font = '700 140px Caveat, cursive'; x.fillText(text, 512, 112);
  }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4; return t;
}

function stripeTexture(color) {
  const c = document.createElement('canvas'); c.width = 64; c.height = 256;
  const x = c.getContext('2d');
  x.fillStyle = '#fffaf2'; x.fillRect(0, 0, 64, 256);
  x.fillStyle = color;
  for (let k = -4; k < 12; k++) { x.beginPath(); x.moveTo(0, k * 32); x.lineTo(64, k * 32 - 40); x.lineTo(64, k * 32 - 24); x.lineTo(0, k * 32 + 16); x.fill(); }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}

// ───────────────────────── flame shader ─────────────────────────
const flameGeo = new THREE.PlaneGeometry(0.085, 0.2, 1, 8); flameGeo.translate(0, 0.1, 0);
function makeFlameMaterial(seed) {
  return new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    uniforms: { uTime: { value: 0 }, uBend: { value: 0 }, uSeed: { value: seed }, uAlpha: { value: 1 }, uScale: { value: 1 } },
    vertexShader: `
      uniform float uTime, uBend, uSeed, uScale;
      varying vec2 vUv;
      void main() {
        vUv = uv;
        vec3 p = position;
        float h = uv.y;
        p.y *= uScale * (1.0 + 0.06 * sin(uTime * 13.0 + uSeed) - 0.25 * uBend);
        p.x += h * h * (0.08 * uBend + 0.01 * sin(uTime * 7.0 + uSeed * 3.0));
        gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0);
      }`,
    fragmentShader: `
      uniform float uAlpha, uTime, uSeed;
      varying vec2 vUv;
      void main() {
        float y = vUv.y;

    const flick = 0.92 + 0.08 * Math.sin(t * 17 + st.i) * Math.sin(t * 5.3 + st.i * 2);
    st.flameMat.uniforms.uAlpha.value = st.flameAlpha * (isActive ? 1 - micStrength * 0.45 : 1);
    st.flameMat.uniforms.uScale.value = 0.6 + 0.4 * st.flameAlpha;
    st.glow.material.opacity = 0.5 * st.flameAlpha * flick;
  }

  // photo reveal: the polaroid "develops"
  for (const st of stations) {
    st.reveal += (st.revealTarget - st.reveal) * Math.min(1, dt * 1.4);
    st.veil.material.opacity = (1 - st.reveal) * 0.85;
    st.veil.visible = st.reveal < 0.995;
  }

  // the one real light follows the nearest lit candle (or the photo you're at)
  if (active && active.flame) {
    const lp = new THREE.Vector3(); active.flame.getWorldPosition(lp); lp.y += 0.12;
    candleLight.position.lerp(lp, Math.min(1, dt * 5));
    const want = (active.flameAlpha * 2.2 + 0.4) * (0.9 + 0.1 * Math.sin(t * 19));
    candleLight.intensity += (want - candleLight.intensity) * Math.min(1, dt * 6);
  } else {
    candleLight.intensity += (0.8 - candleLight.intensity) * Math.min(1, dt * 2);
  }

  // smoke
  for (let k = smoke.length - 1; k >= 0; k--) {
    const sm = smoke[k];
    if (sm.delay > 0) { sm.delay -= dt; continue; }
    sm.life += dt;
    const f = sm.life / sm.max;
    sm.s.position.addScaledVector(sm.v, dt);
    sm.s.position.x += Math.sin(sm.life * 2 + sm.sway) * 0.002;
    sm.s.scale.setScalar(0.05 + f * 0.45);
    sm.s.material.opacity = Math.sin(Math.min(1, f) * Math.PI) * 0.35;
    if (f >= 1) { scene.remove(sm.s); sm.s.material.dispose(); smoke.splice(k, 1); }
  }

  // wish orbs: rise from the wick into the photo, then the photo lights up
  for (let k = orbs.length - 1; k >= 0; k--) {
    const ob = orbs[k];
    ob.t += dt / 1.3;
    const e = Math.min(1, ob.t), arc = Math.sin(e * Math.PI) * 0.35;
    ob.o.position.lerpVectors(ob.from, ob.to, e * e * (3 - 2 * e)); ob.o.position.y += arc;
    ob.o.material.opacity = e < 0.9 ? 1 : (1 - e) * 10;
    ob.o.scale.setScalar(0.22 + Math.sin(e * Math.PI) * 0.15);
    if (e >= 0.75) ob.st.revealTarget = 1;
    if (e >= 1) { scene.remove(ob.o); orbs.splice(k, 1); }
  }

  // confetti specks drift down, balloons bob, sky follows the camera
  for (let i = 0; i < embers.n; i++) {
    embers.pos[i * 3 + 1] -= dt * 0.12; embers.pos[i * 3] += Math.sin(t * 0.7 + embers.seed[i]) * dt * 0.08;
    if (embers.pos[i * 3 + 1] < 0) embers.pos[i * 3 + 1] = 4;
  }
  for (const b of balloons) {
    b.g.position.y = b.by + Math.sin(t * 0.9 + b.seed) * 0.08;
    b.g.rotation.z = Math.sin(t * 0.6 + b.seed * 2) * 0.08;
  }
  sky.position.set(camera.position.x, 0, camera.position.z);
  embers.g.attributes.position.needsUpdate = true;

  // finale
  const nearFinale = started && p > FINALE - 0.15;
  finaleMat.opacity += ((nearFinale ? 1 : 0) - finaleMat.opacity) * Math.min(1, dt * 1.5);
  finaleMesh.position.y = 2.4 + Math.sin(t * 0.8) * 0.06;
  if (nearFinale && !finaleShown && (blownCount >= 17 || FREE)) showFinale();

  // HUD
  if (started && !finaleShown) {
    meterEl.style.opacity = canBlow ? 1 : 0;
    if (canBlow) meterFill.style.width = Math.min(100, active.blowAccum / 0.45 * 100) + '%';
    if (now < wishUntil) setHint('wish', TEXT.wish);
    else if (now < blockedUntil && canBlow) setHint('blocked', TEXT.blocked);
    else if (canBlow) setHint('blow', micOK ? TEXT.blow : TEXT.blowNoMic);
    else if (atStation && near < FINALE) setHint('scroll', TEXT.scroll);
    else setHint('', '');
  }
  if (DEBUG) $('d-p').textContent = p.toFixed(2);

  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}

addEventListener('resize', () => {
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
});

requestAnimationFrame(tick);
</script>
</body>
</html>
